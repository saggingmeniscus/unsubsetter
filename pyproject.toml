[project]
name = "unsubsetter"
version = "0.1.0"
description = "Re-embed full (non-subset) fonts in PDFs."
authors = [{name = "Jacob Smullyan", email = "smulloni@smullyan.org"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pdf", "fonts", "subset", "embedding", "preflight", "kdp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Text Processing :: Fonts",
    "Topic :: Multimedia :: Graphics",
    "Environment :: Console",
]
dependencies = [
    "pikepdf>=9.0",
    "fonttools>=4.50",
    "click>=8.1",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/saggingmeniscus/unsubsetter"
Source = "https://github.com/saggingmeniscus/unsubsetter"
Issues = "https://github.com/saggingmeniscus/unsubsetter/issues"
Changelog = "https://github.com/saggingmeniscus/unsubsetter/blob/master/CHANGELOG.md"

[project.scripts]
unsubsetter = "unsubsetter.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unsubsetter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
